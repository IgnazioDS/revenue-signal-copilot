name: nightly-scoring

# Daily public scoring benchmark. Scores the committed synthetic fixture as of
# the run date, then publishes the refreshed artifacts to the unprotected
# `telemetry` data branch. The default branch is ruleset-protected and the
# default GITHUB_TOKEN cannot push to it, so the auditable git-as-database loop
# lives on `telemetry`. The live stdlib endpoints (api/stats.py,
# api/scoring-latest.py) read the freshest artifact from that branch at request
# time, falling back to the copy committed on main. No database, no secrets.
#
# History accumulates: the runner appends to the prior history, so we seed it
# from the telemetry branch before each run.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # push the data files to the telemetry branch

concurrency:
  group: nightly-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Seed accumulated history from telemetry branch
        run: |
          if git ls-remote --exit-code --heads origin telemetry >/dev/null 2>&1; then
            git fetch origin telemetry --depth=1
            git show origin/telemetry:api/_scoring_history.json \
              > api/_scoring_history.json 2>/dev/null || true
          fi

      - name: Run daily scoring
        run: python -m revenue_signal_copilot.scoring_runner

      - name: Validate published artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("api/_scoring_latest.json").read_text())
          assert artifact["schema_version"] == 1, "schema_version must be 1"
          assert artifact["mode"] == "live", "mode must be live"
          assert artifact["dataset_kind"] == "synthetic-public", "dataset_kind mismatch"
          assert artifact["metrics"]["accounts_total"] > 0, "no accounts scored"
          assert artifact["ranked_accounts"], "no ranked accounts"
          assert artifact["generated_at"].endswith("Z"), "generated_at must be ISO-Z"

          history = json.loads(Path("api/_scoring_history.json").read_text())
          assert history["runs"], "history must have at least one run"
          assert len(history["runs"]) <= 100, "history must be trimmed to 100"

          print("artifact valid:", artifact["run_id"], artifact["metrics"])
          PY

      - name: Publish artifacts to telemetry branch
        run: |
          day="$(date -u +%Y-%m-%dT%H:%MZ)"
          stage="$(mktemp -d)"
          mkdir -p "$stage/api"
          cp api/_scoring_latest.json api/_scoring_history.json "$stage/api/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin telemetry >/dev/null 2>&1; then
            git fetch origin telemetry --depth=1
            git worktree add -B telemetry .telemetry origin/telemetry
          else
            git worktree add --orphan -b telemetry .telemetry
          fi

          mkdir -p .telemetry/api
          cp "$stage/api/"* .telemetry/api/

          git -C .telemetry add api
          if git -C .telemetry diff --cached --quiet; then
            echo "No scoring change to publish."
          else
            git -C .telemetry commit -m "telemetry: nightly scoring ${day}"
            git -C .telemetry push origin telemetry
          fi
