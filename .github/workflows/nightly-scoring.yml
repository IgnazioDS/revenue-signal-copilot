name: nightly-scoring

# Daily public scoring benchmark. Scores the committed synthetic fixture as of
# the run date, then commits the refreshed artifact back to the repo. The push
# triggers a Vercel redeploy, and the stdlib endpoints serve the new artifact.
# This is the "git-as-database" loop: no database, every update is an auditable
# git diff.
#
# The default branch is protected by the "main protection" ruleset, so the
# default GITHUB_TOKEN cannot push to it. We mint a short-lived token from a
# scoped GitHub App (fleet-bot) that is on the ruleset bypass list, and push
# with that. Human PRs are still required for everyone else. Requires two repo
# secrets: FLEET_BOT_APP_ID, FLEET_BOT_PRIVATE_KEY

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read # the app token (not GITHUB_TOKEN) performs the write

concurrency:
  group: nightly-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Mint fleet-bot app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLEET_BOT_APP_ID }}
          private-key: ${{ secrets.FLEET_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Run daily scoring
        run: python -m revenue_signal_copilot.scoring_runner

      - name: Validate published artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path("api/_scoring_latest.json").read_text())
          assert artifact["schema_version"] == 1, "schema_version must be 1"
          assert artifact["mode"] == "live", "mode must be live"
          assert artifact["dataset_kind"] == "synthetic-public", "dataset_kind mismatch"
          assert artifact["metrics"]["accounts_total"] > 0, "no accounts scored"
          assert artifact["ranked_accounts"], "no ranked accounts"
          assert artifact["generated_at"].endswith("Z"), "generated_at must be ISO-Z"

          history = json.loads(Path("api/_scoring_history.json").read_text())
          assert history["runs"], "history must have at least one run"
          assert len(history["runs"]) <= 100, "history must be trimmed to 100"

          print("artifact valid:", artifact["run_id"], artifact["metrics"])
          PY

      - name: Resolve app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="${{ steps.app-token.outputs.app-slug }}"
          uid="$(gh api "/users/${slug}[bot]" --jq .id)"
          echo "name=${slug}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${uid}+${slug}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed artifact
        run: |
          git config user.name "${{ steps.bot.outputs.name }}"
          git config user.email "${{ steps.bot.outputs.email }}"
          git add api/_scoring_latest.json api/_scoring_history.json
          if git diff --staged --quiet; then
            echo "No scoring change to commit."
          else
            git commit -m "chore(scoring): nightly run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
